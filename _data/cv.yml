  sections:
    Experience:
      - company: Cedars-Sinai Medical Center
        position: Visiting Researcher, Department of Computational Biomedicine
        location: Los Angeles, CA, USA
        start_date: 2026-07
        end_date: 2027-01
        summary: "Mentor: Dr. Kyoung Jae Won"
        highlights:
          - Integrating 26 public omics, clinical, and pharmacological knowledge bases into a unified biomedical knowledge graph.
          - Building HybridRAG-AD, a knowledge graph-augmented LLM system for evidence-grounded reasoning in Alzheimer's disease.
          - Supported by the KOBRA overseas research exchange program (Ministry of Science and ICT, Korea).

      - company: Ajou University School of Medicine
        position: Research Fellow, Department of Physiology
        location: Suwon, Korea
        start_date: 2024-09
        end_date: present
        summary: "Mentor: Dr. Hyun Goo Woo"
        highlights:
          - Identified IFI16 variants and expression as MASLD progression markers by integrating whole-exome and bulk transcriptome data (Hepatology, 2025).
          - Characterizing the tumor immune microenvironment of intrahepatic cholangiocarcinoma using single-cell multiome (scRNA-seq, scATAC-seq) data.
          - Resolving intratumoral heterogeneity of hepatocellular carcinoma by integrating Visium spatial transcriptomics with scRNA/snRNA-seq.
          - Developed PPI-aware graph propagation networks for plasma proteome-based subtyping of dementia and MCI (Briefings in Bioinformatics, 2024, 2025; Computers in Biology and Medicine, 2024).

      - company: Insilicogen, Inc.
