cv:
  name: Doyoon (Edward) Kim, Ph.D.
  label: Research Fellow · Computational Biology and Bioinformatics
  location: Suwon, Korea / Los Angeles, CA, USA
  image: ""
  summary: Computational biologist integrating multi-omics, single-cell and spatial transcriptomics, and biomedical knowledge graphs to understand patient heterogeneity and disease progression.

  social_networks:
    - network: GitHub
      username: doyoonkim-ed
    - network: ORCID
